spring.application.name=greenlify

# O acesso ao banco é feito pelo ConnectionFactory (lê SPRING_DATASOURCE_* do ambiente;
# no Docker o compose preenche a partir de ORACLE_URL/ORACLE_USER/ORACLE_PASSWORD do .env).
# Nenhuma credencial deve ser escrita neste arquivo.
# Valores padrão vazios evitam erro de placeholder ao subir sem as variáveis.
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Redis (Sorted Set do ranking). Se estiver fora do ar, o sistema continua
# funcionando: o ranking cai para a consulta no Oracle.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=5s

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

server.port=${PORT:8080}